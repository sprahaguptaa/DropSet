<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>DropSet</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar">
      <div class="brand">DropSet</div>

      <!-- Links are built automatically from the registered features -->
      <nav id="nav" aria-label="Main"></nav>

      <div class="sidebar-footer">
        <p id="user-name" class="muted"></p>
        <button id="logout-btn" class="btn-secondary" type="button">Log out</button>
      </div>
    </aside>

    <main id="content" class="content"></main>
  </div>

  <!-- Core -->
  <script src="js/auth.js"></script>
  <script src="js/app.js"></script>

  <!-- Data (swap for the real database later) -->
  <script src="js/data/gyms.js"></script>

  <!-- Features: to add one, create a file in js/features/ and add a line here. -->
  <script src="js/features/search.js"></script>
  <script src="js/features/gym.js"></script>
  <script src="js/features/passes.js"></script>
  <script src="js/features/profile.js"></script>

  <!-- Start the app (keep this last) -->
  <script>App.start();</script>
</body>
</html>
